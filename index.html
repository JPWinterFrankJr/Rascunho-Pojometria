const financial=pId=>{const rows=state.finances.filter(f=>pId===null?f.spaceId===space().id:f.projectId===pId);return{income:rows.filter(f=>f.type==='income').reduce((s,f)=>s+Number(f.amount),0),expense:rows.filter(f=>f.type==='expense').reduce((s,f)=>s+Number(f.amount),0),investment:rows.filter(f=>f.type==='investment').reduce((s,f)=>s+Number(f.amount),0)}};
const totalFinance=()=>{let f=financial(null),team=people().reduce((s,p)=>s+Number(p.cost||0),0);return{...f,team,total:f.expense+team,result:f.income-f.expense-team}};
const projectCost=pId=>financial(pId).expense+personal(pId);
const isReady=(p,step)=>step===0?canvasKeys.slice(0,3).filter(k=>(p.canvas||{})[k]).length===3:step===1?(p.mvp||[]).length>0:step===2?(tasks(p.id).length>0&&tasks(p.id).every(t=>t.status==='Concluída')):(tasks(p.id).length>0&&tasks(p.id).every(t=>t.status==='Concluída')&&state.metrics.some(m=>m.projectId===p.id&&m.target>0&&m.value>=m.target));
const link=(label,action,args='',ico='arrow')=>`<button class="link" data-action="${action}" ${args}>${esc(label)} ${I(ico,14)}</button>`;
const btn=(label,action,cls='primary',args='',ico='plus')=>`<button type="button" class="btn ${cls}" data-action="${action}" ${args}>${I(ico,16)}${esc(label)}</button>`;
const panel=(html,extra='')=>`<section class="panel ${extra}">${html}</section>`;
const pill=(t,cls='gray')=>`<span class="pill ${cls}">${esc(t)}</span>`;
const line=(pct)=>`<div class="mini-track"><span style="width:${Math.min(100,Math.max(0,Number(pct)||0))}%"></span></div>`;
const header=(sup,title,desc,right='')=>`<div class="page-heading"><div><div class="eyebrow">${sup}</div><h1>${title}</h1><p>${desc}</p></div>${right?`<div class="actions">${right}</div>`:''}</div>`;
const section=(title,desc,right='')=>`<div class="section-head"><div><h3>${title}</h3>${desc?`<p>${desc}</p>`:''}</div>${right}</div>`;
const empty=(title,desc,action,actionLabel)=>`<div class="empty"><div class="empty-icon">${I('folder',21)}</div><h4>${title}</h4><p>${desc}</p>${action?btn(actionLabel,action,'primary'):''}</div>`;
const stat=(name,value,note,ico,tone='')=>panel(`<div class="row between"><span class="label">${name}</span><span class="stat-icon ${tone}">${I(ico,18)}</span></div><div class="metric">${value}</div><div class="hint">${note}</div>`,'stat');
function sidebar(){const nav=[['home','Início','home'],['space','Meu negócio','building'],['projects','Projetos e iniciativas','folder'],['people','Pessoas','people'],['areas','Áreas','grid'],['results','Dashboard','chart'],['fomento','Editais e fomento','file']];const ss=space();const active=route.page==='project'?'projects':route.page;document.getElementById('sidebar').className=`sidebar ${mobile?'open':''}`;document.getElementById('mobileShade').className=`mobile-shade ${mobile?'show':''}`;document.getElementById('sidebar').innerHTML=`<div class="side-head"><span class="logo-mark">${I('layers',20)}</span><div><div class="logo-title">proje<span>metria</span><b class="brand-point">.</b></div><div class="logo-sub">Do plano ao resultado</div></div></div>${ss?`<button class="space-selector" data-action="switch-space" aria-label="Trocar negócio"><span class="space-avatar">${esc(initials(ss.name))}</span><span style="min-width:0;flex:1"><strong style="display:block;font-size:12px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden">${esc(ss.name)}</strong><small class="muted" style="font-size:10px">Trocar negócio</small></span>${I('down',14)}</button>`:`<div class="side-unset"><span class="side-unset-icon">${I('building',17)}</span><strong>Nenhum negócio criado</strong><small>Comece cadastrando seu negócio.</small></div>`}<p class="side-label">Navegação</p><nav class="side-nav">${nav.map(([page,label,ico])=>`<button class="${page===active?'active':''}" data-action="go" data-page="${page}" ${!ss&&page!=='home'?'disabled aria-label="Crie seu negócio para acessar esta área"':''}>${I(ico)}<span>${label}</span>${ss&&page==='projects'?`<span class="count">${projects().length}</span>`:''}</button>`).join('')}</nav><div class="side-foot"><span class="user-avatar">${I('check',16)}</span><div><strong style="display:block;color:#394d65">Ambiente local</strong><span>Dados salvos neste navegador</span></div></div>`}

function topbar(){let crumbs=[['Início','home']];if(route.page==='project'){crumbs.push(['Projetos e iniciativas','projects']);crumbs.push([currentProject()?.name||'Projeto','project'])}else if(route.page!=='home')crumbs.push([{space:'Meu negócio',projects:'Projetos e iniciativas',people:'Pessoas',areas:'Áreas da empresa',activities:'Atividades do negócio',results:'Dashboard',fomento:'Editais e fomento'}[route.page],route.page]);document.getElementById('topbar').innerHTML=`<div class="row" style="min-width:0"><button class="top-mobile" aria-label="Abrir menu" data-action="open-menu">${I('menu',22)}</button><div class="crumbs">${crumbs.map(([label,page],idx)=>`${idx?I('chev',12):''}${idx===crumbs.length-1?`<span>${esc(label)}</span>`:`<button data-action="go" data-page="${page}">${esc(label)}</button>`}`).join('')}</div></div><div class="top-actions"><button type="button" class="theme-toggle" data-action="toggle-theme" aria-label="Alternar para modo ${theme==='light'?'escuro':'claro'}" title="Modo ${theme==='light'?'escuro':'claro'}">${I(theme==='light'?'moon':'sun',19)}<span>${theme==='light'?'Escuro':'Claro'}</span></button><button class="btn" data-action="how">${I('info',16)}<span>Como funciona</span></button></div>`}
function go(page,opts={}){route={page,projectId:opts.projectId??route.projectId,step:opts.step??0};mobile=false;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){if(route.page==='activities')route.page='space';if(!space()&&route.page!=='home')route={page:'home',projectId:null,step:0};sidebar();topbar();let content='';if(route.page==='home')content=homePage();else if(route.page==='space')content=spacePage();else if(route.page==='projects')content=projectsPage();else if(route.page==='people')content=peoplePage();else if(route.page==='results')content=resultsPage();else if(route.page==='fomento')content=fomentoPage();else if(route.page==='project')content=projectPage();else content=homePage();document.getElementById('main').innerHTML=content}
function homePage(){const ss=space();if(!ss){return `<div class="welcome-layout"><div class="eyebrow">BEM-VINDO À PROJEMETRIA</div><h1>Toda ideia merece resultados.<br>Do plano à evolução.</h1><p class="welcome-lead">Planeje ideias, organize projetos e pessoas, acompanhe receitas, custos e indicadores — tudo no mesmo lugar.</p><div class="welcome-first"> <div class="welcome-start-icon">${I('building',25)}</div><div class="welcome-start-copy"><span class="mini-label">PRIMEIRO PASSO</span><h2>Crie seu negócio</h2><p>Ele representa você, sua startup, empresa ou iniciativa pessoal. Não precisa ter CNPJ, equipe ou projeto pronto.</p>${btn('Criar meu negócio','create-space','primary','','arrow')}</div></div><div class="welcome-explainer"><div><span class="welcome-number">01</span><h3>Crie seu negócio</h3><p>Organize sua ideia ou negócio em um lugar.</p></div><div><span class="welcome-number">02</span><h3>Crie projetos e iniciativas</h3><p>Defina o que vai entregar, o prazo e o orçamento.</p></div><div><span class="welcome-number">03</span><h3>Acompanhe</h3><p>Gerencie tarefas, equipe, gastos e indicadores.</p></div></div><div class="welcome-footnote">${I('info',16)} Tudo começa vazio. Você cadastra somente o que precisar e pode editar depois.</div></div>`}
const ps=projects(),hasCanvas=canvasKeys.slice(0,3).some(k=>ss.canvas?.[k]),hasTask=ps.some(p=>tasks(p.id).length>0),f=financial(null),next=!ps.length?{title:'Cadastre seu primeiro projeto',desc:'Um projeto pode ser um software, produto, serviço, trabalho ou qualquer ideia que você queira executar.',label:'Criar projeto',action:'create-project'}:!hasTask?{title:'Continue o planejamento',desc:'Abra seu projeto, defina as entregas mínimas e crie a primeira tarefa.',label:'Abrir projeto',action:'open-project',args:`data-id="${ps[0].id}"`}:{title:'Acompanhe o andamento',desc:'Atualize suas tarefas e registre resultados. Cada projeto tem seu próprio acompanhamento.',label:'Retomar projeto',action:'resume-project',args:`data-id="${ps[0].id}"`};return `${header('Visão geral','Olá, vamos organizar seu trabalho?','Aqui você vê o que existe no seu espaço e qual é o próximo passo.')}<div class="home-welcome"><div><div class="eyebrow">ESPAÇO ATUAL</div><h2>${esc(ss.name)}</h2><p>${esc(ss.description||'Sua iniciativa está criada. Agora você pode definir a ideia e cadastrar projetos.')}</p><div class="row wrap" style="margin-top:17px">${btn('Ver meu negócio','go','soft','data-page="space"','building')}</div></div><div class="home-welcome-aside"><div class="welcome-number big-number">${ps.length}</div><span>projeto${ps.length!==1?'s':''} cadastrado${ps.length!==1?'s':''}</span></div></div><div class="section-head" style="margin-top:27px"><div><h2>Seu próximo passo</h2><p>O que faz mais sentido agora.</p></div></div><div class="next-action-card"><span class="next-action-ico">${I('arrow',22)}</span><div><h3>${next.title}</h3><p>${next.desc}</p></div>${btn(next.label,next.action,'primary',next.args||'','arrow')}</div><div class="section-head" style="margin-top:30px"><div><h2>Como a Projemetria se organiza</h2><p>Três níveis conectados. Você pode navegar entre eles quando quiser.</p></div></div><div class="grid three"><div class="simple-step"><span>01 · VISÃO GERAL</span><h3>Seu espaço</h3><p>Canvas da iniciativa, visão dos projetos e financeiro geral.</p>${link('Abrir espaço','go','data-page="space"')}</div><div class="simple-step"><span>02 · PLANEJAMENTO</span><h3>Projetos</h3><p>Canvas, MVP, orçamento, equipe e documentos de cada projeto.</p>${link('Ver projetos','go','data-page="projects"')}</div><div class="simple-step"><span>03 · ACOMPANHAMENTO</span><h3>Tarefas e resultados</h3><p>Responsáveis, execução, metas e custos vinculados ao projeto.</p>${link('Ir aos projetos','go','data-page="projects"')}</div></div><div style="margin-top:28px">${section('Seus projetos e iniciativas','Abra um projeto para continuar de onde parou.',ps.length?link('Ver todos','go','data-page="projects"'):'')}${ps.length?`<div class="grid two">${ps.slice(0,4).map(projectCard).join('')}</div>`:empty('Nenhum projeto cadastrado','Comece com um projeto. Você vai definir a ideia antes de criar tarefas.','create-project','Criar primeiro projeto')}</div>`}

function projectCard(p){const completedCount=tasks(p.id).filter(t=>t.status==='Concluída').length, c=colors[p.color%colors.length],prog=completed(p.id);return panel(`<div class="project-head"><span class="project-emblem" style="background:${c[0]};color:${c[1]}">${esc(initials(p.name))}</span><div style="flex:1;min-width:0"><button class="project-title" style="border:0;background:none;padding:0;text-align:left" data-action="open-project" data-id="${p.id}">${esc(p.name)}</button><div style="margin-top:6px">${pill(p.status,p.status==='Em andamento'?'green':'orange')}</div></div></div><p class="project-desc">${esc(p.description||'Seu projeto começa com uma boa definição.')}</p><div><div class="statusbar" style="margin-bottom:8px"><span class="muted small">Execução das tarefas</span><strong class="small">${prog}%</strong></div>${line(prog)}</div><div class="project-metrics"><div><strong>${completedCount}/${tasks(p.id).length}</strong><small>Tarefas concluídas</small></div><div><strong>${allocs(p.id).length}</strong><small>Participantes</small></div><div><strong>${money(projectCost(p.id))}</strong><small>Custo estimado</small></div></div><button class="btn soft full" data-action="open-project" data-id="${p.id}">Abrir projeto ${I('arrow',16)}</button>`,'project-card')}
function spacePage(){const s=space(),f=totalFinance(),t=orgTasks(),ps=projects(),ares=departments(),gt=grants(),filled=canvasKeys.filter(k=>s.canvas?.[k]).length,dels=s.mvp||[];return `${header('VISÃO DO NEGÓCIO',esc(s.name),'Estruture seu negócio e acompanhe suas entregas, atividades e projetos em paralelo.',btn('Editar negócio','edit-space','soft','','edit'))}<div class="organization-hero" style="margin-bottom:18px"><div class="org-line"><div class="big-org-avatar">${esc(initials(s.name))}</div><div><div class="tag-list">${pill(s.kind||'Negócio','indigo')}${pill(ps.length+' projetos / iniciativas','gray')}</div><h2 style="margin-top:6px">${esc(s.name)}</h2><p class="muted small" style="margin-top:6px">${esc(s.description||'Defina suas entregas e organize o trabalho para construir seu negócio.')}</p></div></div></div><div class="biz-quick">${btn('Nova entrega do MVP','add-mvp','primary','data-target="space"')}${btn('Projeto ou iniciativa','create-project','soft')}${btn('Adicionar pessoa','add-person','soft')}${btn('Nova área','add-area','soft')}${btn('Edital de fomento','grant-new','soft','data-scope="space"')}</div><div class="biz-stat-grid">${stat('Entregas do negócio',String(dels.length),'Marcos do MVP','target')}${stat('Progresso das entregas',overallDeliveryProgress(s,'space')+'%','Calculado pelas atividades','chart')}${stat('Projetos e iniciativas',String(ps.length),'Em paralelo','folder')}${stat('Pessoas no negócio',String(people().length),'Em '+ares.length+' área(s)','people')}</div><div class="grid two business-structure" style="margin-bottom:20px"><section class="panel">${section('Canvas do negócio','Defina o problema, o público e a proposta de valor.',btn('Editar Canvas','edit-canvas','mini soft','data-target="space"','edit'))}<div class="canvas-grid">${canvasPreview(s.canvas,4)}</div><div class="info-strip" style="margin-top:13px">${I('info',16)}<span>${filled} de ${canvasKeys.length} campos preenchidos.</span></div></section><section class="panel" id="business-deliveries">${section('1 · Entregas do MVP','Primeiro, defina o que precisa ficar pronto.',btn('Nova entrega','add-mvp','mini soft','data-target="space"','plus'))}<div class="flow-hint">${I('target',16)} As atividades só podem ser criadas depois de cadastrar uma entrega.</div>${mvpList(dels,'space',s.id)}</section></div><section class="panel business-activities" id="business-activities" style="margin-bottom:20px">${section('2 · Atividades do negócio','Vincule cada atividade a uma entrega. Conforme concluir, o percentual da entrega aumenta.',dels.length?btn('Nova atividade','add-task','mini primary','data-scope="business"','plus'):'')}${dels.length?`<div class="row wrap delivery-snapshot">${pill(`${t.filter(x=>x.status==='Concluída').length} de ${t.length} atividades concluídas`,'green')}${pill(`${dels.length} entrega(s)`,`indigo`)}</div>`:''}${taskBoard(null)}</section><div class="grid two"><div class="panel">${section('Projetos e iniciativas em paralelo','Cada item tem suas próprias entregas e atividades.',link('Ver portfólio','go','data-page="projects"'))}${ps.length?ps.slice(0,4).map(p=>`<button class="quick-action" data-action="open-project" data-id="${p.id}"><span class="avatar">${esc(initials(p.name))}</span><span style="flex:1"><strong>${esc(p.name)}</strong><small>${entityType(p)} · ${overallDeliveryProgress(p,'project')}% das entregas</small></span>${I('chev',15)}</button>`).join(''):`<div class="inline-empty">Nenhum projeto ou iniciativa cadastrado. ${link('Criar','create-project')}</div>`}</div><div class="panel">${section('Resultado financeiro do negócio','Valores próprios e consolidados dos projetos.',link('Abrir dashboard','go','data-page="results"'))}<div class="finance-summary"><div class="fbox"><small>Receitas</small><strong>${money(f.income)}</strong></div><div class="fbox"><small>Despesas</small><strong>${money(f.expense)}</strong></div><div class="fbox"><small>Aportes</small><strong>${money(f.investment)}</strong></div></div><div class="info-strip" style="margin:15px 0">${I('info',16)}<span>Aportes e receitas são valores separados. O financeiro permanece disponível durante toda a execução.</span></div>${btn('Registrar movimentação','add-finance','soft','data-context="space"')}</div></div>`}
function canvasPreview(c,n=4){return canvasKeys.slice(0,n).map(k=>`<div class="canvas-item ${c?.[k]?'':'unfilled'}"><div class="mini-label">${esc(k)}</div><p>${esc(c?.[k]||'Ainda não definido')}</p></div>`).join('')}
function deliveryTasks(ownerId,deliveryId,target){return state.tasks.filter(t=>t.spaceId===space()?.id&&(t.projectId||null)===(target==='space'?null:ownerId)&&t.mvpId===deliveryId)}
function deliveryStats(ownerId,deliveryId,target){const list=deliveryTasks(ownerId,deliveryId,target),done=list.filter(t=>t.status==='Concluída').length;return {total:list.length,done,percent:list.length?Math.round(done/list.length*100):0}}
function overallDeliveryProgress(owner,target){const arr=owner?.mvp||[];return arr.length?Math.round(arr.reduce((sum,m)=>sum+deliveryStats(owner.id,m.id,target).percent,0)/arr.length):0}
function mvpList(list,target,targetId){const isBusiness=target==='space';return `<div class="deliverables">${list.length?list.map((m,index)=>{const a=deliveryStats(targetId,m.id,target);return `<article class="delivery-card"><div class="delivery-top"><span class="delivery-number">${String(index+1).padStart(2,'0')}</span><div class="delivery-main"><strong>${esc(m.text)}</strong><span>${a.total?`${a.done} de ${a.total} atividades concluídas`:'Nenhuma atividade vinculada ainda'}</span></div><span class="delivery-percent ${a.percent===100&&a.total?'complete':''}">${a.percent}%</span></div><div class="delivery-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${a.percent}" aria-label="Progresso de ${esc(m.text)}"><span style="width:${a.percent}%"></span></div><div class="delivery-bottom"><span class="muted small">${a.total&&a.percent===100?'Entrega finalizada pelas atividades':a.total?`Faltam ${100-a.percent}% para concluir`:'Crie atividades para acompanhar esta entrega'}</span><div class="row wrap"><button class="link" data-action="add-task" data-scope="${isBusiness?'business':'project'}" data-delivery="${m.id}">${I('plus',13)} Atividade</button><button class="icon-button" data-action="edit-mvp" data-target="${target}" data-owner="${targetId}" data-id="${m.id}" title="Editar entrega" aria-label="Editar entrega ${esc(m.text)}">${I('edit',15)}</button><button class="icon-button" data-action="remove-mvp" data-target="${target}" data-owner="${targetId}" data-id="${m.id}" title="Excluir entrega" aria-label="Excluir entrega ${esc(m.text)}">${I('trash',15)}</button></div></div></article>`}).join(''):`<div class="delivery-empty"><span class="delivery-empty-icon">${I('target',22)}</span><div><strong>Comece pelas entregas do MVP</strong><p>Cadastre o que precisa ficar pronto. Depois, vincule as atividades que tornarão cada entrega possível.</p></div><button class="btn primary mini" data-action="add-mvp" data-target="${target}">${I('plus',14)} Primeira entrega</button></div>`}</div>`}
function projectsPage(){const ps=projects();return `${header('Projetos','Seus projetos','Aqui você organiza tudo o que deseja desenvolver ou entregar.',btn('Novo projeto','create-project'))}<div class="info-strip" style="margin-bottom:24px">${I('info',18)}<span><strong>Como funciona:</strong> dentro de cada projeto você seguirá quatro etapas: Definir a ideia → Planejar entregas → Executar tarefas → Avaliar resultados.</span></div>${!ps.length?`<div class="empty-focus"><span class="focus-ico">${I('folder',27)}</span><h2>Seu primeiro projeto começa aqui</h2><p>Crie um projeto para registrar a ideia, planejar o MVP, organizar quem participa e acompanhar a execução. Você pode preencher as informações aos poucos.</p>${btn('Criar primeiro projeto','create-project','primary','','plus')}</div>`:`<div class="grid three">${ps.map(projectCard).join('')}<button data-action="create-project" class="empty project-add-card"><div class="empty-icon">${I('plus',20)}</div><h4>Novo projeto</h4><p>Inicie outro produto, serviço ou trabalho.</p><span class="text-action">Criar projeto ${I('arrow',15)}</span></button></div>`}`}

function peoplePage(){if(!people().length)return `${header('Pessoas','Pessoas e responsabilidades','Cadastre quem participa dos projetos, mesmo que não tenha acesso à plataforma.',btn('Adicionar pessoa','add-person'))}<div class="empty-focus"><span class="focus-ico">${I('people',26)}</span><h2>Quem participa dos seus projetos?</h2><p>Cadastre uma pessoa, informe sua função e, se desejar, um custo mensal de referência. Depois, em cada projeto, você define sua responsabilidade e dedicação.</p>${btn('Cadastrar primeira pessoa','add-person','primary','','plus')}<p class="under-note">Cadastrar uma pessoa não cria uma conta de acesso.</p></div>`;let all=people(),cost=all.reduce((s,p)=>s+Number(p.cost),0);return `${header('Pessoas e responsabilidades','Quem faz o quê?','Cadastre as pessoas uma única vez e distribua sua participação entre os projetos.',btn('Adicionar pessoa','add-person'))}<div class="grid three" style="margin-bottom:21px">${stat('Pessoas no espaço',String(all.length),'Participantes cadastrados','people')}${stat('Custo mensal de referência',money(cost),'Total sem duplicar pessoas','wallet','amber')}${stat('Alocações em projetos',String(state.allocations.filter(a=>projects().some(p=>p.id===a.projectId)).length),'Uma pessoa pode estar em vários projetos','folder')}</div><div class="panel">${section('Equipe cadastrada','Funções, custos mensais e participação por projeto.')}${all.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Profissional</th><th>Vínculo</th><th>Custo mensal</th><th>Projetos</th><th>Ações</th></tr></thead><tbody>${all.map(p=>{const a=state.allocations.filter(a=>a.personId===p.id);return `<tr><td><div class="row"><div class="avatar">${esc(initials(p.name))}</div><div><strong>${esc(p.name)}</strong><div class="muted small">${esc(p.role)}</div></div></div></td><td>${pill(p.type,'gray')}</td><td><strong>${money(p.cost)}</strong></td><td><div class="tag-list">${a.map(x=>pill(projects().find(p=>p.id===x.projectId)?.name||'Projeto const periodChoices=[['30d','30 dias'],['90d','90 dias'],['12m','12 meses'],['all','Tudo']];
function periodStart(){let d=new Date();d.setHours(0,0,0,0);if(dashPeriod==='30d')d.setDate(d.getDate()-29);else if(dashPeriod==='90d')d.setDate(d.getDate()-89);else if(dashPeriod==='12m')d.setMonth(d.getMonth()-11);else return '';return dashPeriod==='12m'?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`:localISO(d)}

function monthsForChart(rows){const now=new Date(), months=[];let n=dashPeriod==='30d'?2:dashPeriod==='90d'?4:12;
  const dd=new Date(now.getFullYear(),now.getMonth(),1);
  if(dashPeriod==='all'&&rows.length){let first=rows.map(x=>monthKey(x.date)).filter(x=>/^\d{4}-\d{2}$/.test(x)).sort()[0];if(first){const [fy,fm]=first.split('-').map(Number);n=Math.min(12,Math.max(1,(now.getFullYear()-fy)*12+now.getMonth()-fm+1));}}
  for(let i=n-1;i>=0;i--){const d=new Date(dd.getFullYear(),dd.getMonth()-i,1);months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,label:d.toLocaleString('pt-BR',{month:'short'}).replace('.','')});}return months;}

function dashboardKpi(title,value,desc,icon,tone=''){return `<div class="dash-kpi"><div class="row between"><div class="dash-kpi-label">${esc(title)}</div><span class="dash-kpi-icon ${tone}">${I(icon,17)}</span></div><strong>${value}</strong><small>${esc(desc)}</small></div>`}
function barChart(rows){const months=monthsForChart(rows);const points=months.map(m=>({...m,...sums(rows.filter(f=>monthKey(f.date)===m.key))}));const max=Math.max(1,...points.map(p=>Math.max(p.income,p.expense)));const any=points.some(p=>p.income||p.expense);const width=760,height=258,pad={left:64,right:16,top:21,bottom:42},ch=height-pad.top-pad.bottom,cw=width-pad.left-pad.right,step=cw/points.length,bar=Math.min(19,step*.26);
 const lines=Array.from({length:5},(_,i)=>{let v=max*(1-i/4),y=pad.top+ch*i/4;return `<line x1="${pad.left}" y1="${y}" x2="${width-pad.right}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="${pad.left-10}" y="${y+4}" text-anchor="end" fill="var(--muted)" font-size="10">${!any?'—':v>=1000?(v/1000).toFixed(v%1000?1:0)+' mil':Number(v.toFixed(1))}</text>`}).join('');
 const rects=points.map((p,i)=>{const x=pad.left+i*step+step/2,b1=p.income/max*ch,b2=p.expense/max*ch,chosen=dashSelectedMonth===p.key;return `<g class="dash-bar-group ${chosen?'selected':''}" data-action="dash-month" data-month="${p.key}" role="button" tabindex="0" aria-label="Selecionar ${esc(p.label)}: receitas ${longMoney(p.income)}; despesas ${longMoney(p.expense)}"><rect x="${x-step*.45}" y="${pad.top}" width="${step*.9}" height="${ch}" fill="transparent"/><rect class="bar-income" x="${x-bar-3}" y="${pad.top+ch-b1}" width="${bar}" height="${Math.max(0,b1)}" rx="4" fill="var(--brand-chart)"/><rect class="bar-expense" x="${x+3}" y="${pad.top+ch-b2}" width="${bar}" height="${Math.max(0,b2)}" rx="4" fill="var(--expense-chart)"/><text x="${x}" y="${height-16}" text-anchor="middle" fill="var(--muted)" font-size="11">${esc(p.label)}</text><title>${p.key}: Receitas ${longMoney(p.income)} | Despesas ${longMoney(p.expense)}. Clique para filtrar.</title></g>`}).join('');
 return `<div class="dash-chart-container"><svg viewBox="0 0 ${width} ${height}" aria-label="Gráfico de receitas e despesas por mês" role="img" class="dash-svg">${lines}${rects}</svg>${!any?'<div class="dash-chart-absence">Sem receitas ou despesas registradas neste período</div>':''}</div>`;}
function donut(tasksList){const totals=[tasksList.filter(t=>t.status==='Concluída').length,tasksList.filter(t=>t.status==='Em andamento').length,tasksList.filter(t=>t.status!=='Concluída'&&t.status!=='Em andamento').length];const total=tasksList.length,pct=total?Math.round(totals[0]/total*100):0;const deg=total?totals.map(x=>x/total*360):[0,0,360];const c=total?`conic-gradient(var(--brand-chart) 0 ${deg[0]}deg, var(--warn-chart) ${deg[0]}deg ${deg[0]+deg[1]}deg, var(--neutral-chart) ${deg[0]+deg[1]}deg 360deg)`:'conic-gradient(var(--line) 0 360deg)';return `<div class="dash-donut-wrap"><div class="dash-donut" style="background:${c}"><span><strong>${pct}%</strong><small>concluídas</small></span></div><div class="dash-legend-col"><div><i style="background:var(--brand-chart)"></i> Concluídas <b>${totals[0]}</b></div><div><i style="background:var(--warn-chart)"></i> Em andamento <b>${totals[1]}</b></div><div><i style="background:var(--neutral-chart)"></i> A fazer <b>${totals[2]}</b></div></div></div>`}
function percentBar(value,max){return `<div class="dash-meter"><span style="width:${max?Math.min(100,Math.max(0,value/max*100)):0}%"></span></div>`}
function deliveryDashboard(selectedProject){const ids=selectedProject?projectsUnder(selectedProject):projects().map(x=>x.id);const entities=selectedProject?ids.map(id=>projects().find(p=>p.id===id)).filter(Boolean):[space(),...projects()];const items=entities.flatMap((owner)=>{const target=owner.id===space()?.id?'space':'project';return (owner.mvp||[]).map(m=>({owner,kind:target,m,stats:deliveryStats(owner.id,m.id,target)}))});const complete=items.filter(x=>x.stats.percent===100&&x.stats.total>0).length;const avg=items.length?Math.round(items.reduce((sum,x)=>sum+x.stats.percent,0)/items.length):0;return `<section class="panel" style="margin-top:18px"><div class="row between wrap dash-panel-title"><div><h3>Progresso das entregas</h3><p>Percentual calculado por atividades concluídas, sem configuração manual. Entregas sem atividades começam em 0%.</p></div>${pill(`${complete} de ${items.length} entregas completas`,'green')}</div>${items.length?`<div class="delivery-dashboard-grid"><div class="delivery-dashboard-summary"><strong>${avg}%</strong><small>Progresso médio das entregas</small><div class="delivery-track"><span style="width:${avg}%"></span></div></div><div class="delivery-dashboard-rows">${items.slice(0,10).map(x=>`<div class="delivery-dashboard-row"><div class="row between"><span><strong>${esc(x.m.text)}</strong><small>${esc(x.owner.name)} · ${x.stats.done}/${x.stats.total} atividades</small></span><b>${x.stats.percent}%</b></div><div class="delivery-track"><span style="width:${x.stats.percent}%"></span></div></div>`).join('')}${items.length>10?`<p class="muted small">Mostrando 10 de ${items.length} entregas. Abra o negócio ou projeto para ver todas.</p>`:''}</div></div>`:`<div class="inline-empty">Nenhuma entrega cadastrada. Comece definindo as entregas do MVP no negócio, projeto ou iniciativa.</div>`}</section>`}

async function dbOpen(){return new Promise((res,rej)=>{if(!('indexedDB' in window)){rej(new Error('Seu navegador não suporta armazenamento local de PDF.'));return;}const rq=indexedDB.open('projemetria_grant_docs',1);rq.onupgradeneeded=()=>{if(!rq.result.objectStoreNames.contains('pdfs'))rq.result.createObjectStore('pdfs')};rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(new Error('Não foi possível acessar os documentos locais.'));});}
async function dbCall(mode,id,blob){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction('pdfs',mode),store=tx.objectStore('pdfs'),rq=mode==='readonly'?store.get(id):blob===null?store.delete(id):store.put(blob,id);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(new Error('Não foi possível armazenar o PDF.'));tx.oncomplete=()=>db.close();tx.onerror=()=>db.close();});}

function sidebar(){const ss=space(),active=route.page==='project'?'projects':route.page,nav=[['home','Início','home'],['space','Meu negócio','building'],['projects','Projetos e iniciativas','folder'],['people','Pessoas','people'],['areas','Áreas da empresa','grid'],['results','Dashboard','chart'],['fomento','Editais e fomento','file']];document.getElementById('sidebar').className=`sidebar ${mobile?'open':''}`;document.getElementById('mobileShade').className=`mobile-shade ${mobile?'show':''}`;document.getElementById('sidebar').innerHTML=`<div class="side-head"><span class="logo-mark">${I('layers',20)}</span><div><div class="logo-title">proje<span>metria</span><b class="brand-point">.</b></div><div class="logo-sub">Do plano ao resultado</div></div></div>${ss?`<button class="space-selector" data-action="switch-space"><span class="space-avatar">${esc(initials(ss.name))}</span><span style="min-width:0;flex:1"><strong style="display:block;font-size:12px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden">${esc(ss.name)}</strong><small class="muted" style="font-size:10px">Trocar negócio</small></span>${I('down',14)}</button>`:`<div class="side-unset"><span class="side-unset-icon">${I('building',17)}</span><strong>Nenhum negócio criado</strong><small>Crie seu negócio para começar.</small></div>`}<p class="side-label">NAVEGAÇÃO</p><nav class="side-nav">${nav.map(([page,label,ico])=>`<button class="${page===active?'active':''}" data-action="go" data-page="${page}" ${!ss&&page!=='home'?'disabled':''}>${I(ico)}<span>${label}</span>${ss&&page==='projects'?`<span class="count">${projects().length}</span>`:''}</button>`).join('')}</nav><div class="side-foot"><span class="user-avatar">${I('check',16)}</span><div><strong style="display:block;color:var(--ink)">Protótipo local</strong><span>Dados salvos neste navegador</span></div></div>`}
function render(){if(route.page==='activities')route.page='space';if(!space()&&route.page!=='home')route={page:'home',projectId:null,step:0};sidebar();topbar();let content=route.page==='home'?homePage():route.page==='space'?spacePage():route.page==='activities'?activitiesPage():route.page==='areas'?areasPage():route.page==='projects'?projectsPage():route.page==='people'?peoplePage():route.page==='results'?resultsPage():route.page==='fomento'?fomentoPage():route.page==='project'?projectPage():homePage();document.getElementById('main').innerHTML=content}
function openV6Dialog(action,ds={}){let s=space(),p=currentProject(),person=state.people.find(x=>x.id===ds.id),area=state.departments.find(x=>x.id===ds.id),task=state.tasks.find(x=>x.id===ds.id);
if(action==='create-space'||action==='edit-space'){let edit=action==='edit-space';modal(edit?'Editar negócio':'Crie seu negócio','Seja startup, empresa, fintech, cooperativa ou outra iniciativa. Você pode começar mesmo sem CNPJ.',`<div class="stack">${field('name','Nome do negócio',edit?s.name:'','text','required maxlength="80"')}${selectField('kind','Tipo de negócio',[['Startup','Startup'],['Empresa','Empresa'],['Fintech','Fintech'],['Cooperativa','Cooperativa'],['Negócio individual','Negócio individual'],['Projeto independente','Projeto independente'],['Outro','Outro']],edit?s.kind:'Startup')}${field('description','O que seu negócio faz?',edit?s.description:'','textarea','maxlength="300"')}<input type="hidden" name="editing" value="${edit?'1':'0'}"><div class="info-strip">${I('info',16)}<span>O negócio pode possuir atividades próprias e vários projetos ou iniciativas em paralelo.</span></div></div>`,'space',false,edit?'Salvar negócio':'Criar negócio');return true;}
if(action==='create-project'||action==='edit-project'){if(!s){openDialog('create-space');return true;}let edit=action==='edit-project'&&p;let choices=[['','Sem vínculo (independente)'],...projects().filter(x=>!edit||x.id!==p.id).map(x=>[x.id,`${entityType(x)} · ${x.name}`])];modal(edit?'Editar projeto ou iniciativa':'Novo projeto ou iniciativa','Cada item pode ter atividades, responsáveis, Canvas, MVP, orçamento, fomento e dashboard.',`<div class="field-grid">${selectField('type','O que você deseja criar?',[['Projeto','Projeto'],['Iniciativa','Iniciativa']],edit?entityType(p):'Projeto','field-span')}${field('name','Nome',edit?p.name:'','text','required maxlength="90" span')}${field('description','Descrição resumida',edit?p.description:'','textarea','maxlength="350" span')}${selectField('parentId','Vincular dentro de (opcional)',choices,edit?p.parentId||'':ds.parentId||'','field-span')}${field('goal','Resultado esperado',edit?p.goal:'','textarea','maxlength="300" span')}${field('budget','Orçamento previsto (R$)',edit?p.budget:'','number','min="0" step="0.01"')}${field('deadline','Prazo estimado',edit?p.deadline:'','date')}${selectField('status','Situação',[['Planejamento','Planejamento'],['Em andamento','Em andamento'],['Concluído','Concluído']],edit?p.status:'Planejamento','field-span')}<input type="hidden" name="editing" value="${edit?'1':'0'}"></div>`,'project',true,edit?'Salvar alterações':'Criar');return true;}
if(action==='add-area'||action==='edit-area'){let edit=action==='edit-area'&&area;modal(edit?'Editar área':'Nova área do negócio','Exemplos: Comercial, Produto, Tecnologia, Financeiro, Operações.',`<div class="stack">${field('name','Nome da área',edit?area.name:'','text','required maxlength="80"')}${field('description','Responsabilidades da área',edit?area.description:'','textarea','maxlength="280"')}<input type="hidden" name="editingId" value="${edit?area.id:''}"></div>`,'area');return true;}
if(action==='add-person'||action==='edit-person'){let edit=action==='edit-person'&&person;modal(edit?'Editar pessoa':'Cadastrar pessoa','A pessoa pertence ao negócio e pode também participar de projetos e iniciativas.',`<div class="field-grid">${field('name','Nome',edit?person.name:'','text','required maxlength="90" span')}${field('role','Função principal',edit?person.role:'','text','maxlength="80"')}${selectField('areaId','Área do negócio',[['','Sem área definida'],...departments().map(a=>[a.id,a.name])],edit?person.areaId||'':'')}${selectField('type','Vínculo',[['Sócio(a)','Sócio(a)'],['Colaborador(a)','Colaborador(a)'],['Freelancer','Freelancer'],['Prestador(a)','Prestador(a)'],['Outro','Outro']],edit?person.type:'Colaborador(a)')}${field('cost','Custo mensal de referência (R$)',edit?person.cost:'','number','min="0" step="0.01"')}<input type="hidden" name="editingId" value="${edit?person.id:''}"></div><div class="info-strip" style="margin-top:16px">${I('info',16)}<span>O cadastro não cria acesso ao sistema. A pessoa pode receber atividades do negócio e participar de vários projetos.</span></div>`,'person');return true;}
if(action==='add-task'||action==='edit-task'){let edit=action==='edit-task'&&task;let pid=edit?(task.projectId||null):(ds.scope==='business'||route.page==='space'?null:route.page==='project'&&p?p.id:null);let owner=pid?projects().find(x=>x.id===pid):s;let deliveries=owner?.mvp||[];if(!deliveries.length&&!edit){modal('Cadastre uma entrega primeiro','Antes de criar atividades, defina o resultado que deseja alcançar no MVP.',`<div class="task-prereq">${I('target',23)}<div><strong>1. Criar uma entrega do MVP</strong><p>2. Criar atividades vinculadas a essa entrega. 3. Concluir as atividades para medir o progresso automaticamente.</p></div></div><button type="button" class="btn primary full" data-action="add-mvp" data-target="${pid?'project':'space'}" style="margin-top:16px">${I('plus',16)} Cadastrar primeira entrega</button>`);return true;}let candidates=pid?allocs(pid).map(a=>a.person):people();let assigned=edit?task.assigneeId:'';if(assigned&&people().some(x=>x.id===assigned)&&!candidates.some(x=>x.id===assigned))candidates.push(personById(assigned));modal(edit?'Editar atividade e resultado':'Nova atividade','Toda atividade deve estar vinculada a uma entrega do MVP. O status atualizado influencia o progresso da entrega.',`<div class="field-grid">${selectField('mvpId','Entrega do MVP *',[['','Selecione a entrega'],...deliveries.map(x=>[x.id,x.text])],edit?task.mvpId||'':ds.delivery||'','field-span')}${field('title','Título da atividade',edit?task.title:'','text','required maxlength="130" span')}${field('description','Descrição / o que será feito',edit?task.description:'','textarea','maxlength="1200" span')}${selectField('assigneeId','Responsável pela entrega',[['','Sem responsável'],...candidates.map(x=>[x.id,x.name])],assigned,'field-span')}${pid?'':selectField('areaId','Área responsável (opcional)',[['','Sem área'],...departments().map(a=>[a.id,a.name])],edit?task.areaId||'':'','field-span')}${selectField('priority','Prioridade',[['Baixa','Baixa'],['Média','Média'],['Alta','Alta']],edit?task.priority:'Média')}${selectField('status','Situação',taskStatuses.map(x=>[x,x]),edit?task.status:'A fazer')}${field('due','Prazo',edit?task.due:'','date','span')}${field('result','Resultado / evidência da entrega',edit?task.result:'','textarea','maxlength="1800" span','O que foi entregue, o que mudou e os resultados alcançados.')}${field('completedAt','Data de conclusão (opcional)',edit?task.completedAt:'','date','span')}<input type="hidden" name="editingId" value="${edit?task.id:''}"><input type="hidden" name="scopeProjectId" value="${pid||''}"></div>${pid&&!candidates.length?`<div class="info-strip" style="margin-top:14px">${I('info',16)}<span>Vincule pessoas na aba Equipe e arquivos para designar responsáveis às atividades.</span></div>`:''}`,'task',true,edit?'Salvar atividade':'Criar atividade');return true;}
return false;
}
function submitV6(type,fd){let v=k=>String(fd.get(k)||'').trim(),n=k=>Number(fd.get(k)||0),s=space(),p=currentProject();try{
if(type==='space'){if(v('editing')==='1'){Object.assign(s,{name:v('name'),kind:v('kind'),description:v('description')})}else{const ns={id:id(),name:v('name'),kind:v('kind'),description:v('description'),canvas:{},mvp:[]};state.spaces.push(ns);state.activeSpaceId=ns.id;route={page:'space',projectId:null,step:0}}}
else if(type==='project'){let parent=v('parentId')||null,edit=v('editing')==='1'&&p;let idNow=edit?p.id:null;if(parent&&idNow&&projectsUnder(idNow).includes(parent))throw Error('Um item não pode ser vinculado dentro dele mesmo ou de seus descendentes.');let obj={name:v('name'),type:v('type')==='Iniciativa'?'Iniciativa':'Projeto',parentId:parent,description:v('description'),goal:v('goal'),budget:n('budget'),deadline:v('deadline'),status:v('status')};if(edit)Object.assign(p,obj);else{let np={id:id(),spaceId:s.id,color:projects().length%colors.length,canvas:{},mvp:[],...obj};state.projects.push(np);route={page:'project',projectId:np.id,step:0}}}
else if(type==='person'){let obj=state.people.find(x=>x.id===v('editingId')),data={name:v('name'),role:v('role'),type:v('type'),areaId:v('areaId')||null,cost:n('cost')};if(obj)Object.assign(obj,data);else state.people.push({id:id(),spaceId:s.id,...data})}
else if(type==='area'){let dupe=departments().some(a=>a.name.toLowerCase()===v('name').toLowerCase()&&a.id!==v('editingId'));if(dupe)throw Error('Já existe uma área com esse nome.');let obj=state.departments.find(x=>x.id===v('editingId'));let data={name:v('name'),description:v('description')};if(obj)Object.assign(obj,data);else state.departments.push({id:id(),spaceId:s.id,...data})}
else if(type==='task'){let obj=state.tasks.find(x=>x.id===v('editingId'));let scopeId=v('scopeProjectId')||null;if(scopeId&&!projects().some(p=>p.id===scopeId))throw Error('Projeto não encontrado.');if(v('assigneeId')&&!people().some(p=>p.id===v('assigneeId')))throw Error('Responsável inválido.');const owner=scopeId?projects().find(p=>p.id===scopeId):s;if(!(owner?.mvp||[]).some(m=>m.id===v('mvpId')))throw Error('Selecione uma entrega do MVP antes de salvar a atividade.');let data={mvpId:v('mvpId'),spaceId:s.id,projectId:scopeId,title:v('title'),description:v('description'),assigneeId:v('assigneeId'),areaId:scopeId?null:v('areaId')||null,priority:v('priority'),status:v('status'),due:v('due'),result:v('result'),completedAt:v('completedAt')};if(obj)Object.assign(obj,data);else state.tasks.push({id:id(),...data})}
else return;
save();closeModal();render();toast('Informações salvas.');}catch(err){toast(err.message||'Não foi possível salvar.')}}
function handleV6Action(action,ds){
if(action==='remove-task'){const item=state.tasks.find(t=>t.id===ds.id);if(item&&item.spaceId===space()?.id&&confirm('Excluir esta atividade? O progresso da entrega será atualizado.')){state.tasks=state.tasks.filter(t=>t.id!==item.id);save();render();toast('Atividade removida.')}return true;}

if(action==='edit-mvp'){const owner=ds.target==='space'?space():state.projects.find(p=>p.id===ds.owner);const item=(owner?.mvp||[]).find(x=>x.id===ds.id);if(!item)return true;modal('Editar entrega do MVP','A alteração do nome não afeta as atividades já vinculadas.',`${field('text','Nome da entrega',item.text,'text','required maxlength="140"')}<input type="hidden" name="target" value="${ds.target}"><input type="hidden" name="ownerId" value="${ds.owner}"><input type="hidden" name="editingId" value="${ds.id}">`,'mvp',false,'Salvar entrega');return true;}
if(action==='remove-mvp'){const owner=ds.target==='space'?space():state.projects.find(p=>p.id===ds.owner),item=(owner?.mvp||[]).find(x=>x.id===ds.id);if(!owner||!item)return true;const n=deliveryTasks(owner.id,item.id,ds.target).length;if(n){toast(`Esta entrega possui ${n} atividade(s). Reatribua ou exclua as atividades antes de remover a entrega.`);return true;}if(confirm('Excluir esta entrega do MVP?')){owner.mvp=owner.mvp.filter(x=>x.id!==ds.id);save();render();toast('Entrega excluída.')}return true;}
if(action==='create-child'){openDialog('create-project',{parentId:ds.parentId});return true;}if(action==='remove-area'){let a=state.departments.find(x=>x.id===ds.id);if(a&&confirm('Excluir a área? As pessoas permanecerão cadastradas, mas ficarão sem área.')){state.departments=state.departments.filter(x=>x.id!==a.id);people().forEach(p=>{if(p.areaId===a.id)p.areaId=null});save();render()}return true}return false;}
function showGrantDialog(g,ds={}){const editing=!!g,mainId=editing?g.projectId:ds.scope==='project'?ds.project||currentProject()?.id:null,selected=new Set(g?.relatedIds|| (mainId?[mainId]:[])),options=[['','Direto no negócio'],...projects().map(x=>[x.id,`${entityType(x)}: ${x.name}`])];const others=projects().map(x=>`<label><input type="checkbox" name="relatedIds" value="${esc(x.id)}" ${selected.has(x.id)?'checked':''}><span>${esc(entityType(x))}: ${esc(x.name)}</span></label>`).join('');const fields=field('title','Nome do edital',g?.title||'','text','required maxlength="140" span')+field('reference','Número / referência',g?.reference||'','text','maxlength="90"')+field('agency','Instituição concedente',g?.agency||'','text','maxlength="110"')+selectField('projectId','Onde o recurso será contabilizado ao ser recebido?',options,mainId||'','field-span')+`<div class="field field-span"><label>Outros projetos e iniciativas relacionados (opcional)</label><div class="association-group">${others||'<span class="muted small">Cadastre projetos ou iniciativas para vincular o edital.</span>'}</div><div class="help">Pode aparecer em vários itens, mas será contabilizado financeiramente em apenas um.</div></div>`+selectField('kind','Modalidade',grantKinds.map(x=>[x,x]),g?.kind||'Subvenção')+selectField('status','Situação',grantStatuses.map(x=>[x,x]),g?.status||'Em preparação')+selectField('responsibleId','Responsável',[['','Sem responsável'],...people().map(x=>[x.id,x.name])],g?.responsibleId||'')+field('deadline','Prazo de inscrição',g?.deadline||'','date')+field('submissionDate','Data de inscrição',g?.submissionDate||'','date')+field('resultDate','Resultado previsto/efetivo',g?.resultDate||'','date')+field('requested','Valor solicitado (R$)',g?.requested||'','number','min="0" step="0.01"')+field('approved','Valor aprovado (R$)',g?.approved||'','number','min="0" step="0.01"')+field('url','Link oficial',g?.url||'','url','maxlength="500" span')+field('eligibility','Requisitos para participar',g?.eligibility||'','textarea','maxlength="1800" span')+field('rules','Regras e uso dos recursos',g?.rules||'','textarea','maxlength="1800" span')+field('obligations','Obrigações / prestação de contas',g?.obligations||'','textarea','maxlength="1800" span')+field('notes','Próximos passos / observações',g?.notes||'','textarea','maxlength="1600" span');modal(editing?'Editar edital':'Cadastrar edital de fomento','Associe o edital ao negócio e a quantos projetos ou iniciativas forem necessários.',`<div class="field-grid">${fields}</div><input type="hidden" name="editingId" value="${g?.id||''}"><div class="info-strip" style="margin-top:15px">${I('info',16)}<span>Valor solicitado não é recebido. Um aporte efetivo deve ser registrado uma única vez no financeiro.</span></div>`,'grant',true,editing?'Salvar edital':'Cadastrar edital');}
function grantInfoCard(g){const linked=(g.relatedIds||[]).map(id=>projects().find(p=>p.id===id)).filter(Boolean);return `<article class="grant-card"><div class="grant-card-top"><div><div class="row wrap" style="margin-bottom:9px">${pill(g.status,statusTone(g.status))}<span class="grant-scope">${I('building',12)} Negócio</span>${linked.slice(0,2).map(x=>`<span class="grant-scope">${I('folder',12)} ${esc(x.name)}</span>`).join('')}${linked.length>2?pill('+'+(linked.length-2)+' vínculos'):''}</div><h3>${esc(g.title)}</h3><p>${esc(g.agency||'Instituição não informada')}${g.reference?' · '+esc(g.reference):''}</p></div><button class="btn mini soft" data-action="grant-view" data-id="${g.id}">Abrir ${I('arrow',14)}</button></div><div class="grant-card-foot"><div><small>Solicitado</small><strong>${money(g.requested)}</strong></div><div><small>Aprovado</small><strong>${money(g.approved)}</strong></div><div><small>Inscrição até</small><strong>${fmtDate(g.deadline)}</strong></div><div><small>PDFs</small><strong>${state.grantFiles.filter(f=>f.grantId===g.id).length}</strong></div></div></article>`}

function getDashboardDataset(projectId){const start=periodStart(),selectedProject=projectId||(dashProject!=='all'&&projects().some(p=>p.id===dashProject)?dashProject:null),ids=selectedProject?projectsUnder(selectedProject):projects().map(x=>x.id);const groupRows=state.finances.filter(f=>f.spaceId===space().id&&(selectedProject?ids.includes(f.projectId):true));const validRows=groupRows.filter(f=>!start||(f.date||'')>=start),rows=validRows.filter(f=>!dashSelectedMonth||monthKey(f.date)===dashSelectedMonth);const scopedTasks=allTasks().filter(t=>selectedProject?ids.includes(t.projectId):true);const scopedPeople=selectedProject?new Set(state.allocations.filter(a=>ids.includes(a.projectId)).map(a=>a.personId)).size:people().length;const team=selectedProject?ids.reduce((s,pid)=>s+personal(pid),0):people().reduce((s,p)=>s+Number(p.cost||0),0);const scopedGrants=selectedProject?scopeGrants(selectedProject):grants();const budget=selectedProject?ids.reduce((s,i)=>s+Number(projects().find(x=>x.id===i)?.budget||0),0):projects().reduce((s,x)=>s+Number(x.budget||0),0);return {selectedProject,groupRows,validRows,rows,scopedTasks,scopedPeople,team,scopedGrants,budget,start};}

render();
})();
